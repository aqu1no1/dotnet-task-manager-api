name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch, version, changelog, and tag
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from main." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use vMAJOR.MINOR.PATCH, for example v0.1.0." >&2
            exit 1
          fi

          git fetch origin main --depth=1
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "The selected commit is not the current HEAD of origin/main." >&2
            exit 1
          fi

          version_without_prefix="${VERSION#v}"
          project_version="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("src/TaskManager.Api/TaskManager.Api.csproj").findtext("./PropertyGroup/Version", ""))')"
          if [[ "$version_without_prefix" != "$project_version" ]]; then
            echo "Requested $version_without_prefix does not match the API project version $project_version." >&2
            exit 1
          fi

          if ! grep -Eq "^## \\[${version_without_prefix//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a dated section for $version_without_prefix." >&2
            exit 1
          fi

          if [[ -n "$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")" ]]; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" >/dev/null 2>&1; then
            echo "A GitHub Release for $VERSION already exists." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Reusable CI
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore TaskManager.slnx

      - name: Publish API
        run: dotnet publish src/TaskManager.Api/TaskManager.Api.csproj -c Release --no-restore -o artifacts/publish

      - name: Package publish output
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p artifacts
          cd artifacts/publish
          zip -qr "../TaskManager.Api_${VERSION}.zip" .

      - name: Extract release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"][1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$\n(.*?)(?=^## \[|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None or not match.group(1).strip():
              raise SystemExit(f"No release notes found for {version}.")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Upload packaged API artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager.Api_${{ needs.validate.outputs.version }}
          path: artifacts/TaskManager.Api_${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error

      - name: Create annotated tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: gh release create "$VERSION" "artifacts/TaskManager.Api_${VERSION}.zip" --title "$VERSION" --notes-file release-notes.md
